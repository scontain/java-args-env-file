apiVersion: batch/v1
kind: Job
metadata:
  name: java-cli-env-reader
  namespace: {{NAMESPACE}}
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: java-cli-env
          image: {{REPO}}:{{TAG}}
          imagePullPolicy: Always
          args: ["arg1", "arg2s"]
          volumeMounts:
            - name: config-volume
              mountPath: /config
              readOnly: true
      volumes:
        - name: config-volume
          projected:
            sources:
              - configMap:
                  name: java-cli-env-config
              - secret:
                  name: java-cli-env-secret
      imagePullSecrets:
        - name: {{PULLSECRET}}
