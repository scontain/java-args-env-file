apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-cli-env-reader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-cli-env-reader
  template:
    metadata:
      labels:
        app: java-cli-env-reader
    spec:
      containers:
        - name: java-cli-env-reader
          image: {{REPO}}:{{TAG}}
          args: ["arg1", "arg2"]
          volumeMounts:
            - name: config-volume
              mountPath: /config/configs.yaml
              subPath: configs.yaml
            - name: secret-volume
              mountPath: /config/secrets
              subPath: secrets
      imagePullSecrets:
        - name: {{PULLSECRET}}
      volumes:
        - name: config-volume
          configMap:
            name: app-config
        - name: secret-volume
          secret:
            secretName: app-secret
